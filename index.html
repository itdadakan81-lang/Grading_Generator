<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Grading TBS Internal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-6 px-4">

    <div class="max-w-2xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="bg-emerald-800 text-white p-5 rounded-2xl shadow-lg flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-wide">Grading TBS Internal</h1>
                <p class="text-xs text-emerald-200 mt-1">Form Inspeksi & Kalkulator Sampel</p>
            </div>
            <span class="bg-emerald-700 text-emerald-100 text-xs px-3 py-1 rounded-full font-semibold border border-emerald-600">
                v2.0 New
            </span>
        </div>

        <!-- Form Input -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
            <h2 class="text-md font-semibold text-slate-800 border-b pb-2">Detail Pengiriman & Sampel</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Tanggal -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Tanggal Inspeksi</label>
                    <input type="date" id="inputTanggal" class="w-full text-sm border-slate-300 rounded-lg p-2.5 bg-slate-50 border focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <!-- AFD -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Afdeling (AFD)</label>
                    <input type="text" id="inputAfd" placeholder="Contoh: AFD I" class="w-full text-sm border-slate-300 rounded-lg p-2.5 bg-slate-50 border focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <!-- Nama Driver -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Nama Driver</label>
                    <input type="text" id="inputDriver" placeholder="Nama Supir" class="w-full text-sm border-slate-300 rounded-lg p-2.5 bg-slate-50 border focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <!-- No Pol -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">No. Polisi (Plat)</label>
                    <input type="text" id="inputNopol" placeholder="BK 1234 XX" class="w-full text-sm border-slate-300 rounded-lg p-2.5 bg-slate-50 border focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <!-- Tonase Netto -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Tonase Netto (Kg)</label>
                    <input type="number" id="inputNetto" placeholder="0" class="w-full text-sm border-slate-300 rounded-lg p-2.5 bg-slate-50 border focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <!-- Rit Ke -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Rit Ke-</label>
                    <input type="number" id="inputRit" placeholder="1" class="w-full text-sm border-slate-300 rounded-lg p-2.5 bg-slate-50 border focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <!-- Jjg KAB -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Jjg KAB</label>
                    <input type="number" id="inputKab" placeholder="0" class="w-full text-sm border-slate-300 rounded-lg p-2.5 bg-slate-50 border focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <!-- Jjg PAB -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Jjg PAB</label>
                    <input type="number" id="inputPab" placeholder="0" class="w-full text-sm border-slate-300 rounded-lg p-2.5 bg-slate-50 border focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
            </div>

            <!-- Custom Input Photo -->
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Foto Bukti (Kamera / Galeri)</label>
                <input type="file" id="inputFoto" accept="image/*" capture="environment" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 border rounded-lg p-1 bg-slate-50">
                <div id="previewContainer" class="mt-2 hidden">
                    <img id="imgPreview" class="h-32 rounded-lg border object-cover">
                </div>
            </div>

            <h2 class="text-md font-semibold text-slate-800 border-b pb-2 pt-2">Data Sampel & Kategori Fruit</h2>

            <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                <!-- Jumlah Sampel -->
                <div class="col-span-2 md:col-span-3">
                    <label class="block text-xs font-semibold text-emerald-800 mb-1">Jumlah Sampel (Jjg)</label>
                    <input type="number" id="inputJmlSampel" value="100" class="w-full text-sm border-emerald-400 bg-emerald-50/50 rounded-lg p-2.5 border font-bold text-emerald-900 focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <!-- Input Rincian Grading -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">BM (Jjg)</label>
                    <input type="number" id="inputBm" placeholder="0" class="w-full text-sm border-slate-300 rounded-lg p-2 bg-slate-50 border outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">BB (Jjg)</label>
                    <input type="number" id="inputBb" placeholder="0" class="w-full text-sm border-slate-300 rounded-lg p-2 bg-slate-50 border outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">TP (Jjg)</label>
                    <input type="number" id="inputTp" placeholder="0" class="w-full text-sm border-slate-300 rounded-lg p-2 bg-slate-50 border outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Jjg Kosong</label>
                    <input type="number" id="inputJk" placeholder="0" class="w-full text-sm border-slate-300 rounded-lg p-2 bg-slate-50 border outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Parteno (Jjg)</label>
                    <input type="number" id="inputParteno" placeholder="0" class="w-full text-sm border-slate-300 rounded-lg p-2 bg-slate-50 border outline-none">
                </div>
            </div>

            <!-- Tombol Generate -->
            <button onclick="generateReport()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition-all flex justify-center items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                Generate Laporan
            </button>
        </div>

        <!-- Output Result Section -->
        <div id="outputContainer" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <h2 class="text-md font-semibold text-slate-800 border-b pb-2">Hasil Output Text</h2>

            <div class="bg-slate-900 text-emerald-400 p-4 rounded-xl font-mono text-sm whitespace-pre-wrap leading-relaxed shadow-inner" id="outputText"></div>

            <!-- Tombol Copy WhatsApp -->
            <button onclick="copyToWhatsApp()" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition-all flex justify-center items-center gap-2">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
                Copy for WhatsApp
            </button>
        </div>

    </div>

    <script>
        // Set default tanggal hari ini
        document.getElementById('inputTanggal').valueAsDate = new Date();

        // Preview Foto
        document.getElementById('inputFoto').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    document.getElementById('imgPreview').src = evt.target.result;
                    document.getElementById('previewContainer').classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        // Helper Format Persentase
        function formatPercent(val, total) {
            if (!val || val == 0 || !total || total == 0) return "-";
            const count = parseFloat(val);
            const tot = parseFloat(total);
            const pct = (count / tot) * 100;
            return `${count}(${pct.toFixed(2).replace('.', ',')}%)`;
        }

        // Format Tanggal Indonesia (Rabu, 12 Agustus 2026)
        function formatTanggalIndo(dateString) {
            if (!dateString) return "-";
            const date = new Date(dateString);
            const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            return date.toLocaleDateString('id-ID', options);
        }

        let rawTextWhatsApp = "";

        function generateReport() {
            const tanggal = document.getElementById('inputTanggal').value;
            const tglFormatted = formatTanggalIndo(tanggal);
            const jmlSampel = document.getElementById('inputJmlSampel').value || 100;
            
            const afd = document.getElementById('inputAfd').value || '-';
            const driver = document.getElementById('inputDriver').value || '-';
            const nopol = document.getElementById('inputNopol').value || '-';
            const netto = document.getElementById('inputNetto').value ? Number(document.getElementById('inputNetto').value).toLocaleString('id-ID') : '-';
            const kab = document.getElementById('inputKab').value || '-';
            const pab = document.getElementById('inputPab').value || '-';
            const rit = document.getElementById('inputRit').value || '-';

            const bm = document.getElementById('inputBm').value;
            const bb = document.getElementById('inputBb').value;
            const tp = document.getElementById('inputTp').value;
            const jk = document.getElementById('inputJk').value;
            const parteno = document.getElementById('inputParteno').value;

            // Generate Teks WhatsApp dengan markdown bold (*)
            rawTextWhatsApp = 
`Grading Sampel ${jmlSampel}jjg
Tanggal (${tglFormatted})

AFD : ${afd}
Nama Driver : ${driver}
No pol : ${nopol}
Tonase netto : ${netto} kg
Jjg KAB: ${kab}
Rit ke : ${rit}

Jjg PAB : ${pab}
BM : ${formatPercent(bm, jmlSampel)}
BB  : ${formatPercent(bb, jmlSampel)}
TP  : ${formatPercent(tp, jmlSampel)}
Jjg kosong : ${formatPercent(jk, jmlSampel)}
Parteno : ${formatPercent(parteno, jmlSampel)}`;

            document.getElementById('outputText').innerText = rawTextWhatsApp;
            document.getElementById('outputContainer').classList.remove('hidden');
            document.getElementById('outputContainer').scrollIntoView({ behavior: 'smooth' });
        }

        function copyToWhatsApp() {
            if (!rawTextWhatsApp) return;
            navigator.clipboard.writeText(rawTextWhatsApp).then(() => {
                alert("Teks berhasil disalin! Silakan paste/tempel di WhatsApp.");
            }).catch(err => {
                alert("Gagal menyalin teks secara otomatis. Silakan salin teks secara manual.");
            });
        }
    </script>
</body>
</html>
